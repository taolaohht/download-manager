name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Rust tests (engine, core, video, torrent, native host)
        run: cargo test --workspace --exclude prism-app
      - name: Frontend dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix extension
      - name: Build frontend and extension
        run: |
          npm run build --prefix app
          npm run build --prefix extension
      - name: Build sidecar (debug)
        run: node scripts/build-sidecar.mjs --debug
      - name: Clippy (whole workspace incl. app shell)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: App typecheck and tests
        run: |
          npm run typecheck --prefix app
          npm test --prefix app
      - name: Extension typecheck and tests
        run: |
          npm run typecheck --prefix extension
          npm test --prefix extension

  extension-e2e:
    name: Extension E2E (Chromium, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install extension dependencies
        run: npm ci --prefix extension
      - name: Build extension
        run: npm run build --prefix extension
      - name: Build native messaging host
        run: cargo build -p prism-native-host --release
      - name: Install Playwright Chromium
        run: ./extension/node_modules/.bin/playwright install chromium
      - name: Run extension E2E
        run: npm run e2e --prefix extension

name: Windows portable release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix extension
      - name: Build extension
        run: npm run build --prefix extension
      - name: Build Windows native host sidecar
        run: node scripts/build-sidecar.mjs --target x86_64-pc-windows-msvc
      - name: Build signed Windows updater bundle
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Build app for manual runs
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Create portable zip
        shell: pwsh
        run: ./scripts/make-portable.ps1 -Target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v5
        with:
          name: prism-windows-x64-portable
          path: |
            packaging/out/*.zip
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error

  publish:
    name: Publish Windows portable release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: prism-windows-x64-portable
          path: artifacts
      - name: Prepare portable release and update manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem artifacts -Filter *.zip -Recurse | Copy-Item -Destination out
          $manifest = py -3 scripts/make-latest-json.py artifacts "$env:GITHUB_REF_NAME" docs/RELEASE_NOTES.md
          [System.IO.File]::WriteAllText("out/latest.json", ($manifest -join [Environment]::NewLine), [System.Text.UTF8Encoding]::new($false))
          $checksums = Get-ChildItem out -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/latest.json
            out/SHA256SUMS.txt
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: true
